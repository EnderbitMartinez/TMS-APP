<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMS Logistics - Iniciar Sesión</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Encabezado con Presentación / Logo -->
    <div class="bg-blue-600 p-8 text-center text-white">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-full mb-3 text-3xl">
        🚛
      </div>
      <h1 class="text-2xl font-bold tracking-wide">Sistema TMS</h1>
      <p class="text-blue-100 text-sm mt-1">Gestión Controlada de Operaciones y Transportes</p>
    </div>

    <!-- Formulario de Login -->
    <div class="p-8">
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="usuario@empresa.com" 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
        </div>

        <div id="errorMessage" class="hidden text-red-600 text-xs bg-red-50 p-3 rounded-lg border border-red-200"></div>

        <button type="submit" id="btnLogin" 
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-all">
          Ingresar al Sistema
        </button>
      </form>
    </div>

    <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center text-xs text-slate-400">
      Plataforma Operativa v1.0
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const btnLogin = document.getElementById('btnLogin');

    // Verificar si ya está autenticado
    async function checkExistingSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    }
    checkExistingSession();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.add('hidden');
      btnLogin.innerText = 'Autenticando...';
      btnLogin.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errorMessage.innerText = 'Credenciales inválidas o usuario no registrado.';
        errorMessage.classList.remove('hidden');
        btnLogin.innerText = 'Ingresar al Sistema';
        btnLogin.disabled = false;
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
