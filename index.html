<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMS Logistics - Iniciar Sesión</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

 <!-- CABECERA AZUL DE LA TARJETA DE LOGIN -->
<div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 2rem 1.5rem; text-align: center; border-radius: 12px 12px 0 0;">
  
  <!-- LOGO SVG CAMIÓN AERODINÁMICO -->
  <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
    <svg width="68" height="68" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="5" width="90" height="90" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <!-- Líneas de velocidad -->
      <path d="M 15 35 H 35 M 10 50 H 28 M 18 65 H 32" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <!-- Cabina estilizada -->
      <path d="M 32 32 L 62 32 C 70 32, 76 38, 80 46 L 85 60 C 87 64, 85 70, 78 70 L 32 70 Z" fill="url(#loginSpeedGrad)"/>
      <!-- Parabrisas -->
      <path d="M 62 37 L 74 49 H 62 Z" fill="#93c5fd"/>
      <!-- Franja naranja dinámica -->
      <path d="M 40 80 H 80 L 86 70 H 46 Z" fill="#f97316"/>
      <!-- Ruedas -->
      <circle cx="44" cy="70" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <circle cx="72" cy="70" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <defs>
        <linearGradient id="loginSpeedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- TÍTULO Y SUBTÍTULO CON NUEVO TIPOGRAFÍA -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 0.25rem;">
    <span style="color: #ffffff; font-weight: 900; font-size: 1.5rem; letter-spacing: 0.5px;">TMS</span>
    <span style="color: #f97316; font-weight: 800; font-size: 1.25rem;">|</span>
    <span style="color: #3b82f6; font-weight: 700; font-size: 1.2rem; letter-spacing: 2px;">LOGISTICS</span>
  </div>
  <p style="color: #94a3b8; font-size: 0.8rem; font-weight: 500; margin: 0; letter-spacing: 0.5px;">
    Gestión Controlada de Operaciones y Transportes
  </p>
</div>

    <!-- Formulario de Login -->
    <div class="p-8">
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="usuario@empresa.com" 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
        </div>

        <div id="errorMessage" class="hidden text-red-600 text-xs bg-red-50 p-3 rounded-lg border border-red-200 font-medium"></div>

        <button type="submit" id="btnLogin" 
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-all">
          Ingresar al Sistema
        </button>
      </form>
    </div>

    <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center text-xs text-slate-400">
      Plataforma Operativa v1.0
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const btnLogin = document.getElementById('btnLogin');

    // Comprobar sesión existente
    async function checkExistingSession() {
      try {
        if (typeof supabaseClient !== 'undefined') {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session) {
            window.location.href = 'dashboard.html';
          }
        }
      } catch (e) {
        console.error("Error comprobando sesión:", e);
      }
    }
    checkExistingSession();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorMessage.classList.add('hidden');
      errorMessage.innerText = '';
      btnLogin.innerText = 'Autenticando...';
      btnLogin.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        if (typeof supabaseClient === 'undefined') {
          throw new Error('Error de conexión con Supabase. Revisa el archivo config.js.');
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        if (data?.session) {
          window.location.href = 'dashboard.html';
        }

      } catch (err) {
        let msg = 'Usuario o contraseña incorrectos.';
        if (err.message && err.message.includes('config.js')) {
          msg = err.message;
        } else if (err.message && err.message.includes('Invalid login credentials')) {
          msg = 'Correo o contraseña incorrectos. Verifica tus datos o crea el usuario en Supabase.';
        } else if (err.message) {
          msg = 'Error: ' + err.message;
        }

        errorMessage.innerText = msg;
        errorMessage.classList.remove('hidden');
      } finally {
        btnLogin.innerText = 'Ingresar al Sistema';
        btnLogin.disabled = false;
      }
    });
  </script>
</body>
</html>
